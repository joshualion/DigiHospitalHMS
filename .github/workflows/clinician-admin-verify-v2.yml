name: Clinician admin checkpoint verify v2

on:
  push:
    branches:
      - phase-foundation-clinician-admin-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing || true
          php artisan key:generate --env=testing --force
      - name: Verify routes
        run: php artisan route:list
      - name: Run staff invitation and membership test
        run: php artisan test tests/Feature/Phase1AFoundationTest.php --filter=test_staff_can_be_invited_with_roles_and_facility_membership
      - name: Run appointment clinician workflow test
        run: php artisan test tests/Feature/Phase2BAppointmentsQueuesTest.php --filter=test_booking_conflicts_reschedule_cancel_confirm_no_show_and_history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built assets when changed
        run: |
          if ! git diff --quiet -- public/build; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/build
            git commit -m "Build frontend assets"
            git push
          fi
