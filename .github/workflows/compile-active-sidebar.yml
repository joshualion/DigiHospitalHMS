name: Compile Active Sidebar Styling
on:
  push:
    branches: [fix/theme-active-sidebar-groups-20261015]
    paths: ['.github/workflows/compile-active-sidebar.yml']
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: compile themed sidebar active states"
            git push origin HEAD:fix/theme-active-sidebar-groups-20261015
          fi
