name: Compile News Blog Release
on:
  push:
    branches:
      - feature/news-blog-and-sidebar-icons-20261014
    paths:
      - '.github/workflows/compile-news-blog.yml'
      - 'resources/js/**'
permissions:
  contents: write
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit compiled frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: compile News blog and navigation release"
            git push origin HEAD:feature/news-blog-and-sidebar-icons-20261014
          fi
