name: Compile Overview Fix
on:
  push:
    branches: [fix/overview-accordion-20261014]
    paths: ['.github/workflows/compile-overview-fix.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/build
          if ! git diff --cached --quiet; then
            git commit -m "build: compile Overview accordion fix"
            git push origin HEAD:fix/overview-accordion-20261014
          fi
