name: Demo staff purge verify

on:
  push:
    branches:
      - fix-demo-staff-purge

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing || true
          php artisan key:generate --env=testing --force
      - run: php artisan route:list > /dev/null
      - run: php artisan test tests/Feature/StaffDoctorAppointmentManagementTest.php
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built assets when changed
        run: |
          if ! git diff --quiet -- public/build; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/build
            git commit -m "Build frontend assets"
            git push
          fi
