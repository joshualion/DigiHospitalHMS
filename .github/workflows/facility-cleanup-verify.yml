name: Facility cleanup verify

on:
  push:
    branches:
      - fix/facility-management-cleanup

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing || true
          php artisan key:generate --env=testing --force

      - name: Verify routes
        run: php artisan route:list

      - name: Run public appointment request test
        run: php artisan test tests/Feature/Phase2BAppointmentsQueuesTest.php --filter=test_public_request_is_encrypted_reviewed_and_does_not_create_patient_or_appointment

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Commit built assets when changed
        run: |
          if ! git diff --quiet -- public/build; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/build
            git commit -m "Build public frontend assets"
            git push
          fi
