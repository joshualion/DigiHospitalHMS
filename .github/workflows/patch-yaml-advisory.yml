name: Patch Composer YAML Advisory
on:
  push:
    branches: [fix/home-about-separate-intro-20261015]
    paths: ['.github/workflows/patch-yaml-advisory.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
      - run: composer update symfony/yaml --with-dependencies --no-interaction --no-scripts --no-progress
      - run: composer audit --locked --no-interaction
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock
          if ! git diff --cached --quiet; then
            git commit -m "security: patch Symfony YAML recursion advisory"
            git push origin HEAD:fix/home-about-separate-intro-20261015
          fi
