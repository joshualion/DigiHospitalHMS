name: Prepare About and News Release

on:
  push:
    branches:
      - feature/about-news-editorial-20261013
    paths:
      - '.github/workflows/prepare-about-news-release.yml'

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: none
      - name: Update vulnerable PHP dependencies within existing constraints
        run: composer update laravel/framework league/commonmark league/flysystem --with-all-dependencies --no-interaction --no-progress
      - name: Prepare test environment
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing --force
      - name: Validate routes and run PHP tests
        run: |
          php artisan route:list > /dev/null
          php artisan test
      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build production frontend
        run: npm run build
      - name: Commit tested lockfile and built assets to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock public/build
          if ! git diff --cached --quiet; then
            git commit -m "chore: update audited PHP locks and compile About/News frontend"
            git push origin HEAD:feature/about-news-editorial-20261013
          fi
