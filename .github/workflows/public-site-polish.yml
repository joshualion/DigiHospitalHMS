name: Public site polish verify and build

on:
  push:
    branches:
      - fix/public-site-polish

permissions:
  contents: write

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit built assets when changed
        run: |
          if ! git diff --quiet -- public/build; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/build
            git commit -m "Build public frontend assets"
            git push
          fi
